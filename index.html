.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,var(--saffron2),var(--saffron));display:grid;place-items:center;color:var(--night);font-weight:800;font-size:15px;letter-spacing:.02em;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.brand b{display:block;font-size:14.5px;color:#fff;line-height:1.25}.brand small{font-size:11.5px;color:#7FA69D}
.navgrp{font-size:11.5px;color:#6E968D;padding:16px 12px 6px;font-weight:600}
.nav{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:0;background:none;color:inherit;font:inherit;border-radius:9px;cursor:pointer;text-align:left;transition:background .15s}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav.on{background:rgba(255,255,255,.1);color:#fff;font-weight:650}
.nav.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--saffron)}
.nav.on svg{color:var(--saffron)}
.nav .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700}
.save{margin-top:auto;font-size:11.5px;color:#6E968D;padding:16px 12px 0;display:flex;align-items:center;gap:6px}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mint)}
.brand-img{background:#fff;border-radius:14px;padding:12px 14px;border-bottom:0;margin:0 2px 8px}.brand-img img{width:100%;display:block}
.hero-id{display:flex;gap:16px;align-items:center}.hero-logo{background:#fff;border-radius:14px;padding:10px 12px;width:150px;flex-shrink:0;box-shadow:0 8px 18px -10px rgba(0,0,0,.6)}.hero-logo img{width:100%;display:block}
@media (max-width:860px){.hero-id{flex-direction:column;align-items:flex-start;gap:12px}.hero-logo{width:130px}}
.btn.pdfbtn{background:#2E3192;border-color:#2E3192;color:#fff}.btn.pdfbtn:hover{background:#3B3FB0;border-color:#3B3FB0}
.pdfview{background:#E4E9E7;border-radius:12px;padding:14px;display:flex;justify-content:center;min-height:240px;align-items:center}
.pdfview img{width:100%;max-width:560px;border-radius:4px;box-shadow:0 10px 30px -12px rgba(10,39,48,.45);background:#fff}
.sigbox{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:14px;background:#FAFCFB}
.sigbox-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sigactions{display:flex;gap:8px;flex-wrap:wrap}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff;text-decoration:none}.btn.wa:hover{background:#25C263}.btn.wa.off{opacity:.5;pointer-events:none}
.signpad{position:relative;margin-bottom:10px}.signpad canvas{display:block;width:100%;aspect-ratio:5/2;background:#fff;border:1.5px dashed #AEB4C6;border-radius:12px;touch-action:none;cursor:crosshair}
.signhint{position:absolute;left:16px;bottom:12px;font-size:12px;color:#A0A8B8;pointer-events:none}.signclear{position:absolute;top:8px;right:8px}
.sigprev{display:block;width:100%;max-width:360px;aspect-ratio:600/220;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.sigmeta{font-size:12.5px;color:var(--muted);margin:4px 0 10px}
.agree{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin:4px 0 12px;cursor:pointer}.agree input{margin-top:3px;width:18px;height:18px}
.client{max-width:760px;margin:0 auto;padding:14px 14px 60px;font-family:"Manrope","Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh}
.client-h{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.client-h img{width:130px}.client-h b{display:block;font-size:16px}.client-h span{color:var(--muted);font-size:13px}
.client .panel{margin-bottom:12px}.btn.big{width:100%;justify-content:center;padding:14px;font-size:15px}
.ok-panel{border-color:#9FD9C0;background:#F1FBF6}.ok-panel h3{color:#1E7A5E}
.phsec{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:14px;background:#FAFCFB}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{position:relative;border:1.5px dashed #BFCBC7;background:#fff;border-radius:10px;aspect-ratio:4/3;padding:0;cursor:pointer;overflow:hidden;font:inherit;display:flex;align-items:center;justify-content:center}
.ph.has{border:1px solid var(--line)}.ph img{width:100%;height:100%;object-fit:cover}
.ph-add{color:var(--petrol2);display:grid;place-items:center;margin-bottom:14px}.ph.phmore{border-color:var(--petrol2);background:#F2F8F6}
.ph-l{position:absolute;left:0;right:0;bottom:0;font-size:11px;font-weight:700;padding:3px 6px;background:rgba(255,255,255,.9);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.viewer{background:rgba(5,15,18,.92);z-index:80}.viewer-in{max-width:900px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:94vh}
.viewer-in img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:8px;align-self:center}.viewer-b{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.msgedit{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#FAFCFB}
.msgedit input{font:inherit;font-weight:700;padding:8px 10px;border:1px solid var(--line);border-radius:8px;flex:1}
.msgedit textarea{font:inherit;width:100%;margin-top:8px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;min-height:74px;resize:vertical}
.plan{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px;-webkit-overflow-scrolling:touch}
.plan-in{position:relative}.plan-row{position:relative;display:flex;border-bottom:1px solid var(--line2);height:56px}
.plan-head{height:48px;background:#F3F7F5;border-bottom:1px solid var(--line)}
.plan-lab{position:sticky;left:0;z-index:3;flex:0 0 var(--lw);width:var(--lw);background:#fff;border:0;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:3px;padding:6px 10px;font:inherit;font-size:12px;color:var(--muted);text-align:left;cursor:pointer}
.plan-head .plan-lab{background:#F3F7F5;font-weight:700;color:var(--night);cursor:default}
.plan-lab span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.plan-day{flex:0 0 var(--cw);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);border-left:1px solid var(--line2)}
.plan-day b{font-size:14px;color:var(--night)}.plan-day.today{background:var(--saffron);color:var(--night)}.plan-day.today b{color:var(--night)}.plan-day.we{background:#EAF0ED}
.plan-cell{flex:0 0 var(--cw);border:0;border-left:1px solid var(--line2);background:transparent;cursor:pointer;padding:0}
.plan-cell:hover{background:#F2F8F6}.plan-cell.we{background:#F7F9F8}.plan-cell.today{background:#FDF4DF}
.plan-row.maint .plan-cell{background:repeating-linear-gradient(135deg,#FCF0D5 0 6px,#fff 6px 12px)}
.plan-bar{position:absolute;top:10px;height:36px;z-index:2;border:0;border-radius:8px;color:#fff;font:inherit;font-size:12px;font-weight:700;padding:0 8px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:0 2px 6px -2px rgba(10,39,48,.4)}
.plan-bar.run{background:var(--blue)}.plan-bar.soon{background:#7FA3D6}.plan-bar.late{background:var(--red)}.plan-bar.done{background:#B8C2BF;color:#2C3A3E}
.plan-bar.resa{background:#7A4BC0}.plan-bar.resa.wait{background:repeating-linear-gradient(135deg,#7A4BC0 0 8px,#9470CF 8px 16px)}
/* ---------- main ---------- */
.main{flex:1;min-width:0;padding:26px 32px 110px;max-width:1320px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head h1{font-size:28px;margin:0;font-weight:800;letter-spacing:-.02em;color:var(--night)}
.head p{margin:3px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 15px;border-radius:10px;font:inherit;font-weight:650;cursor:pointer;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--petrol2)}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--petrol);color:#fff;border-color:var(--petrol);box-shadow:0 6px 14px -8px rgba(15,76,92,.8)}.btn.pri:hover{background:var(--petrol2)}
.btn.acc{background:var(--saffron);border-color:var(--saffron);color:var(--night);box-shadow:0 6px 14px -8px rgba(227,166,47,.9)}.btn.acc:hover{background:var(--saffron2)}
.btn.danger{color:var(--red);border-color:#EFC9C4}.btn.danger.arm{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 12px;box-shadow:0 1px 2px rgba(10,39,48,.04)}
.search input{border:0;outline:0;padding:10px 0;font:inherit;width:100%;background:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:600}
.chip.on{background:var(--night);color:#fff;border-color:var(--night)}
/* ---------- list rows ---------- */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:10px}
.row{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px 13px 18px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tone,var(--line))}
.row:hover{border-color:#B9CBC5;box-shadow:var(--sh)}
.row .body{flex:1;min-width:0}.row .t{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--night)}
.row .s{color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex-shrink:0}.row .amt{font-weight:800;font-variant-numeric:tabular-nums;color:var(--night)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;background:#EDF2F0;color:var(--muted);white-space:nowrap}
.pill.green{background:var(--mintbg);color:#1E7A5E}.pill.red{background:var(--redbg);color:var(--red)}
.pill.amber{background:var(--amberbg);color:#8A5A00}.pill.blue{background:var(--bluebg);color:var(--blue)}
.pill.green::before,.pill.red::before,.pill.amber::before,.pill.blue::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
/* ---------- plaque marocaine ---------- */
.plate{display:inline-flex;align-items:stretch;border:1.5px solid #1A1A1A;border-radius:5px;background:linear-gradient(#fff,#F4F6F5);font-weight:800;font-size:12px;letter-spacing:.05em;font-variant-numeric:tabular-nums;line-height:1;color:#111;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.plate span{padding:4px 7px}.plate span+span{border-left:1.5px solid #1A1A1A}
.empty{background:#fff;border:1.5px dashed #C8D6D1;border-radius:14px;padding:40px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}
/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,39,48,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet{background:#fff;border-radius:18px;width:100%;max-width:760px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 60px -20px rgba(10,39,48,.5)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;background:var(--night) var(--zel);color:#fff}
.sheet-h h2{margin:0;font-size:18px;font-weight:750}.sheet-h .x{color:#9FC0B7}
.sheet-b{padding:20px 22px;overflow-y:auto}.sheet-f{display:flex;gap:8px;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap;background:#FAFCFB}
.x{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px;display:grid}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fld{display:flex;flex-direction:column;gap:5px}.fld.wide{grid-column:1/-1}
.fld label{font-size:12.5px;color:var(--muted);font-weight:650}.fld label em{color:var(--red);font-style:normal}
.fld input,.fld select,.fld textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#F8FBFA;color:var(--ink);width:100%;transition:border-color .15s,background .15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{background:#fff;border-color:var(--petrol2)}
.fld textarea{min-height:70px;resize:vertical}
.addinline{display:flex;gap:6px}.addinline input{flex:1}
/* ---------- ticket de calcul ---------- */
.calc{position:relative;margin-top:20px;background:#fff;border:1.5px dashed #BFD0CA;border-radius:14px;padding:30px 16px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px 14px}
.calc::before{content:"Calcul automatique";position:absolute;top:-11px;left:16px;background:var(--petrol);color:#fff;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px}
.calc div small{display:block;color:var(--muted);font-size:11.5px;font-weight:600}.calc div b{font-variant-numeric:tabular-nums;font-size:14.5px}
.calc .big{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;border-top:1.5px dashed #BFD0CA;padding-top:12px;margin-top:2px}
.calc .big small{font-size:13px;color:var(--night);font-weight:800}.calc .big b{font-size:26px;color:var(--petrol);font-weight:800;letter-spacing:-.01em}
/* ---------- dashboard ---------- */
.hero{position:relative;background:var(--night) var(--zel);color:#fff;border-radius:20px;padding:24px 26px 22px;margin-bottom:14px;overflow:hidden;box-shadow:0 20px 40px -24px rgba(10,39,48,.7)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--saffron),var(--saffron2) 40%,var(--mint))}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.hello{color:var(--saffron2);font-weight:700;font-size:13.5px}
.hero h1{margin:2px 0 0;font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.hero .date{color:#8FB3AA;font-size:13px;margin-top:4px;text-transform:capitalize}
.hero-figs{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:22px;border-top:1px solid rgba(255,255,255,.1);padding-top:16px}
.fig{padding:0 18px;border-left:1px solid rgba(255,255,255,.1)}.fig:first-child{padding-left:0;border-left:0}
.fig span{display:block;font-size:12.5px;color:#8FB3AA;font-weight:600}
.fig b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:3px}
.fig b.pos{color:#7FE0BB}.fig b.neg{color:#FF9D91}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(10,39,48,.04)}
.panel h3{margin:0 0 12px;font-size:15.5px;font-weight:750;display:flex;align-items:center;gap:8px;color:var(--night)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.panel-h h3{margin:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.occ{display:inline-flex;align-items:center;gap:8px;background:var(--night);color:#fff;border-radius:20px;padding:3px 12px 3px 4px;font-weight:700}
.occ em{font-style:normal;background:var(--saffron);color:var(--night);border-radius:20px;padding:1px 8px}
/* le parking */
.lot{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px;padding:14px;border-radius:12px;background:#394A4F;background-image:repeating-linear-gradient(90deg,transparent 0 calc(100% - 2px),transparent 0),linear-gradient(#34454A,#2E3E43)}
.slot{--c:var(--mint);position:relative;min-width:0;border:0;border-radius:10px;background:#fff;padding:14px 12px 12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px;border-top:5px solid var(--c);box-shadow:0 6px 14px -8px rgba(0,0,0,.5);transition:transform .15s}
.slot:hover{transform:translateY(-2px)}
.slot::after{content:"";position:absolute;left:10px;right:10px;bottom:-8px;height:2px;background:repeating-linear-gradient(90deg,#F2D48A 0 10px,transparent 10px 18px);opacity:.55}
.slot.loue{--c:var(--blue)}.slot.maint{--c:var(--saffron)}.slot.retard{--c:var(--red)}
.slot .model{font-weight:750;font-size:13.5px;color:var(--night)}
.slot .st{font-size:12px;font-weight:700;color:var(--c)}.slot .who{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .plate{align-self:flex-start;max-width:100%}.slot .warn{position:absolute;top:-9px;right:-7px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--red);color:#fff;border:2px solid #fff;display:grid;place-items:center;font-size:11px;font-weight:800;z-index:1}
.slot.addslot{background:transparent;border:1.5px dashed rgba(255,255,255,.35);border-top:1.5px dashed rgba(255,255,255,.35);color:#C9D8D3;align-items:center;justify-content:center;box-shadow:none}
.slot.addslot::after{display:none}
@media (prefers-reduced-motion:no-preference){.slot{animation:park .45s cubic-bezier(.2,.8,.2,1) both}@keyframes park{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.kpi{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--petrol)) 12%,white);color:var(--c,var(--petrol));flex-shrink:0}
.kpi small{color:var(--muted);font-size:12.5px;font-weight:600;display:block}.kpi b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--night);letter-spacing:-.02em;line-height:1.2}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-bottom:14px}
.al{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line2);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;font:inherit;color:inherit;text-align:left;border-radius:6px}
.al:hover{background:#F6F9F8}.al:last-child{border-bottom:0}
.al .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent)}
.ok{display:flex;gap:8px;align-items:center;color:#1E7A5E;background:var(--mintbg);padding:12px 14px;border-radius:10px;font-weight:650}
/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.tbl th{font-size:12px;color:var(--muted);font-weight:700;text-align:right;padding:9px 10px;border-bottom:2px solid var(--night);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}.tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
.tbl tbody tr:hover td{background:#F6F9F8}
.tbl tr.tot td{font-weight:800;border-top:2px solid var(--night);border-bottom:0;background:#F3F7F5}.tbl .neg{color:var(--red)}.tbl .pos{color:#1E7A5E}
.scroll{overflow-x:auto}
.catrow{display:grid;grid-template-columns:minmax(140px,1.2fr) 2fr 110px;gap:12px;align-items:center;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line2)}
.catrow b{text-align:right}
.catbar{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--saffron),var(--saffron2))}
.tabs{display:flex;gap:4px;background:#E1E9E6;padding:4px;border-radius:11px;width:fit-content}
.tabs button{border:0;background:none;padding:7px 15px;border-radius:8px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}.tabs button.on{background:#fff;color:var(--night);box-shadow:0 1px 3px rgba(10,39,48,.12)}
.listed{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}.listed span{display:inline-flex;align-items:center;gap:4px;background:#EDF3F0;border:1px solid var(--line);border-radius:20px;padding:3px 4px 3px 11px;font-size:13px;font-weight:600}
.listed button{border:0;background:none;cursor:pointer;color:var(--muted);display:grid;padding:2px;border-radius:50%}.listed button:hover{background:var(--redbg);color:var(--red)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--night);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;z-index:60;box-shadow:0 12px 24px -10px rgba(10,39,48,.6);border-left:4px solid var(--saffron)}
.fab,.bottom{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media (max-width:860px){
 .side{display:none}.main{padding:14px 12px 120px}.head h1{font-size:24px}
 .list{grid-template-columns:1fr}.kpis{gap:8px}.kpi{padding:12px}.kpi b{font-size:18px}.kpi .ic{width:34px;height:34px}
 .hero{padding:18px 18px 18px;border-radius:16px}.hero h1{font-size:26px}.hero-top .btn{display:none}
 .hero-figs{grid-template-columns:1fr 1fr;gap:14px 0}.fig{padding:0 12px}.fig:nth-child(3){padding-left:0;border-left:0}.fig b{font-size:19px}
 .lot{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px 10px 16px;gap:14px 10px}.slot .plate{font-size:11px}.slot .plate span{padding:4px 5px}.slot{min-height:108px;padding:12px 10px 10px}
 .form{grid-template-columns:1fr}.overlay{align-items:flex-end;padding:0}.sheet{border-radius:18px 18px 0 0;max-height:94vh}
 .head .btn.pri.add{display:none}.toast{bottom:90px}
 .catrow{grid-template-columns:1fr 90px}.catrow>div{grid-column:1/-1;grid-row:2}
 .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:84px;width:56px;height:56px;border-radius:18px;background:var(--saffron);color:var(--night);border:0;box-shadow:0 10px 20px -8px rgba(227,166,47,.9);z-index:40;cursor:pointer}
 .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--night) var(--zel);z-index:45;padding:7px 4px calc(7px + env(safe-area-inset-bottom));border-top:3px solid var(--saffron)}
 .bottom button{border:0;background:none;color:#7FA69D;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:10.5px;font-weight:650;padding:4px;cursor:pointer}
 .bottom button.on{color:var(--saffron2)}
 .more{position:fixed;inset:0;background:rgba(10,39,48,.5);z-index:46;display:flex;align-items:flex-end}
 .more-in{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px 12px 96px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
 .more-in button{border:1px solid var(--line);background:#F8FBFA;border-radius:12px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;font:inherit;font-size:12px;font-weight:650;color:var(--ink);cursor:pointer}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(20px);opacity:.5}to{transform:none;opacity:1}}}
